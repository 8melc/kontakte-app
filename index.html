<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InTouch">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-arcs.png">
<title>InTouch</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #222222;
  --border: #2a2a2a;
  --border2: #333333;
  --text: #f0ede8;
  --text2: #888880;
  --text3: #555550;
  --red: #e05a4e;
  --amber: #e0944e;
  --green: #7ec87e;
  --gold: #c8a87e;
  --radius: 12px;
  --radius-sm: 8px;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: -webkit-fill-available; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
input, textarea, button, select { font-family: var(--sans); }

/* App shell */
.app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
}
.app-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

/* Header */
.header {
  padding: 52px 20px 14px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.header-date {
  font-size: 12px;
  color: var(--text2);
  font-family: var(--mono);
  margin-top: 2px;
}

/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav-inner {
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  height: 56px;
  position: relative;
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  height: 100%;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: color 0.15s;
}
.nav-tab.active { color: var(--text); }
.nav-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  margin-bottom: 2px;
}
.nav-tab.active .nav-dot { background: var(--text); }

/* Floating action button */
.fab {
  position: fixed;
  bottom: calc(68px + env(safe-area-inset-bottom));
  right: max(16px, calc((100vw - 430px)/2 + 16px));
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--text);
  color: var(--bg);
  border: none;
  font-size: 24px;
  font-weight: 300;
  cursor: pointer;
  z-index: 51;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

/* Sections */
.section { padding: 0 20px; margin-bottom: 12px; }
.section-label {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 16px 0 8px;
}

/* Cards */
.cards { display: flex; flex-direction: column; gap: 1px; }
.card {
  background: var(--surface);
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.1s;
}
.card:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.card:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.card:only-child { border-radius: var(--radius); }
.card:active { background: var(--surface2); }
.card.urgent { border-left-color: var(--red); }
.card.soon { border-left-color: var(--amber); }
.card.ok { border-left-color: var(--green); }
.card.neutral { border-left-color: var(--border2); }

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  font-family: var(--mono);
  background: var(--surface2);
  color: var(--text2);
}
.av-inner { background: #2a2418; color: var(--gold); }
.av-close { background: #1e1e2a; color: #8888cc; }
.av-mid { background: #1e2a1e; color: var(--green); }
.av-loose { background: #222220; color: var(--text3); }
.card-info { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 500; }
.card-meta {
  font-size: 12px;
  color: var(--text2);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--mono);
}
.card-right { text-align: right; flex-shrink: 0; }
.card-days { font-size: 12px; font-family: var(--mono); }
.card-days.urgent { color: var(--red); }
.card-days.soon { color: var(--amber); }
.card-days.ok { color: var(--green); }
.card-days.neutral { color: var(--text3); }
.card-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }

.empty-block {
  padding: 20px 16px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
  background: var(--surface);
  border-radius: var(--radius);
}

/* Day row in Heute view */
.day-row { margin-bottom: 16px; }
.day-header {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.day-header-date { font-family: var(--mono); font-size: 11px; color: var(--text2); }
.day-today { color: var(--red); }

/* Overdue banner */
.overdue-banner {
  background: var(--surface);
  border: 1px solid #3a2020;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.overdue-title {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--red);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.overdue-person {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  cursor: pointer;
}
.overdue-person-name { font-size: 14px; font-weight: 500; flex: 1; }
.overdue-person-days { font-size: 12px; font-family: var(--mono); color: var(--red); }

/* Search bar */
.search-bar {
  padding: 8px 20px 4px;
}
.search-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  -webkit-appearance: none;
}
.search-input:focus { outline: none; border-color: var(--border2); }
.search-input::placeholder { color: var(--text3); }

/* Filter row */
.filter-row { display: flex; gap: 6px; padding: 8px 20px 0; flex-wrap: wrap; }
.filter-btn {
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  font-family: var(--sans);
  transition: all 0.15s;
}
.filter-btn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }

/* Relevance section in Personen */
.relevance-section {
  padding: 12px 20px 0;
}
.relevance-question {
  font-size: 15px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 12px;
  line-height: 1.4;
}
.relevance-cards {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.relevance-cards::-webkit-scrollbar { display: none; }
.relevance-card {
  flex-shrink: 0;
  width: 140px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: background 0.1s;
}
.relevance-card:active { background: var(--surface2); }
.relevance-card-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--mono);
  margin-bottom: 10px;
}
.relevance-card-name {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.relevance-card-hint {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  line-height: 1.3;
}
.relevance-card-hint.urgent { color: var(--red); }
.relevance-card-hint.soon { color: var(--amber); }

/* Level group in Personen */
.level-group { margin-bottom: 4px; }
.level-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 8px;
  cursor: pointer;
}
.level-group-title {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.level-group-count {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
}
.level-group-chevron {
  color: var(--text3);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.level-group-chevron.collapsed { transform: rotate(-90deg); }
.level-group-cards { display: flex; flex-direction: column; gap: 1px; }
.level-group-cards.collapsed { display: none; }

/* Anlässe timeline */
.anlass-month {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 16px 0 8px;
}
.anlass-card {
  background: var(--surface);
  padding: 13px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
}
.anlass-card:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.anlass-card:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.anlass-card:only-child { border-radius: var(--radius); }
.anlass-card:active { background: var(--surface2); }
.anlass-date-col {
  flex-shrink: 0;
  width: 44px;
  text-align: center;
}
.anlass-day { font-size: 20px; font-weight: 600; font-family: var(--mono); }
.anlass-weekday { font-size: 10px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; }
.anlass-info { flex: 1; min-width: 0; }
.anlass-title { font-size: 14px; font-weight: 500; }
.anlass-people { font-size: 12px; color: var(--text2); margin-top: 2px; }
.anlass-actions-count { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 3px; }
.anlass-typ {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--mono);
  background: var(--surface2);
  color: var(--text2);
  flex-shrink: 0;
  align-self: center;
}

/* Bottom-sheet overlay */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  transition: opacity 0.25s ease;
}
.overlay.open { display: block; }
.overlay.visible { opacity: 1; }
.overlay-inner {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  max-width: 430px;
  margin: 0 auto;
  max-height: 92vh;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  transform: translateY(100%);
  transition: transform 0.34s cubic-bezier(0.32, 0.72, 0, 1);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px calc(32px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
}
.overlay.visible .overlay-inner { transform: translateY(0); }
.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 8px auto 12px;
  cursor: grab;
  flex-shrink: 0;
}
.sheet-grab {
  padding: 0;
  margin: 0 -20px;
  display: flex;
  justify-content: center;
  touch-action: none;
}
.overlay-inner.dragging .overlay-inner,
.overlay-inner.dragging { transition: none; }

/* Back button */
.back-btn {
  background: transparent;
  border: none;
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  margin-bottom: 20px;
  font-family: var(--sans);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Form elements */
.form-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  -webkit-appearance: none;
}
.form-input:focus { outline: none; border-color: var(--text3); }
.form-input::placeholder { color: var(--text3); }
.form-input[type="date"] { color-scheme: dark; }
textarea.form-input { resize: vertical; min-height: 80px; font-family: var(--sans); }
select.form-input { color-scheme: dark; }

.level-select { display: flex; gap: 6px; flex-wrap: wrap; }
.level-opt {
  flex: 1;
  min-width: 0;
  padding: 10px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.level-opt.sel-inner { background: #2a2418; border-color: var(--gold); color: var(--gold); }
.level-opt.sel-close { background: #1e1e2a; border-color: #8888cc; color: #8888cc; }
.level-opt.sel-mid { background: #1e2a1e; border-color: var(--green); color: var(--green); }
.level-opt.sel-loose { background: #222220; border-color: var(--border2); color: var(--text2); }

.form-actions { display: flex; gap: 8px; margin-top: 24px; }
.btn-primary {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--text);
  color: var(--bg);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary:active { opacity: 0.85; }
.btn-secondary {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-size: 15px;
  cursor: pointer;
}
.btn-danger {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-sm);
  border: 1px solid #3a2020;
  background: transparent;
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  margin-top: 12px;
}

/* Detail view */
.detail-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.detail-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 600; font-family: var(--mono);
}
.detail-name { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
.detail-level { font-size: 12px; color: var(--text2); font-family: var(--mono); margin-top: 2px; }

.info-list {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 16px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.info-row:last-child { border-bottom: none; }
.info-key { color: var(--text2); }
.info-val { font-weight: 500; font-family: var(--mono); font-size: 13px; text-align: right; max-width: 60%; }

.action-list { display: flex; flex-direction: column; gap: 1px; margin-bottom: 16px; }
.action-btn {
  width: 100%;
  padding: 14px 16px;
  text-align: left;
  background: var(--surface);
  border: none;
  border-radius: 0;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.action-btn:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.action-btn:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.action-btn:only-child { border-radius: var(--radius); }
.action-btn:active { background: var(--surface2); }
.action-btn.danger { color: var(--red); }
.action-arrow { color: var(--text3); font-family: var(--mono); }

/* Quick entry modal */
.quick-options { display: flex; flex-direction: column; gap: 1px; margin-bottom: 20px; }
.quick-opt {
  width: 100%;
  padding: 16px;
  text-align: left;
  background: var(--surface);
  border: none;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.quick-opt:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.quick-opt:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.quick-opt:only-child { border-radius: var(--radius); }
.quick-opt:active { background: var(--surface2); }
.quick-opt-sub { font-size: 12px; color: var(--text3); font-family: var(--mono); }

/* Checkbox style for actions */
.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  cursor: pointer;
}
.check-row:active { background: var(--surface2); }
.check-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.check-row:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.check-row:only-child { border-radius: var(--radius); }
.check-box {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--green);
  transition: all 0.15s;
}
.check-box.checked { border-color: var(--green); background: #1e2a1e; }
.check-text { flex: 1; font-size: 14px; }
.check-text.checked { color: var(--text3); text-decoration: line-through; }
.check-meta { font-size: 11px; color: var(--text3); font-family: var(--mono); }

/* Person picker in forms */
.person-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.person-chip {
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.person-chip.selected { background: var(--surface2); border-color: var(--border2); color: var(--text); }

/* Vorlauf input group */
.vorlauf-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.vorlauf-row:last-child { border-bottom: none; }
.vorlauf-name { flex: 1; font-size: 14px; }
.vorlauf-input {
  width: 60px;
  padding: 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-family: var(--mono);
  text-align: center;
  -webkit-appearance: none;
}
.vorlauf-suffix { font-size: 12px; color: var(--text2); font-family: var(--mono); }

/* Settings number input */
.settings-num {
  width: 52px;
  padding: 6px 4px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: var(--mono);
  text-align: center;
  -webkit-appearance: none;
  -moz-appearance: textfield;
}
.settings-num:focus { outline: none; border-color: var(--text3); }
.settings-num::-webkit-inner-spin-button,
.settings-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* Person picker overlay (bottom-sheet style) */
.picker-suggestions {
  margin-bottom: 20px;
}
.picker-suggestion-label {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 10px;
  line-height: 1.4;
}
.picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.picker-cell {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: background 0.1s;
}
.picker-cell:active { background: var(--surface2); }
.picker-cell-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--mono);
  margin: 0 auto 6px;
}
.picker-cell-name {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.picker-cell-hint {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text3);
  margin-top: 2px;
}

.picker-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0 12px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.picker-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Toast notification */
.toast {
  position: fixed;
  bottom: calc(140px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 20px;
  font-size: 13px;
  color: var(--text);
  font-family: var(--mono);
  z-index: 200;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ─── Swipe-to-action ─── */
.swipe-wrap {
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
.swipe-wrap:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.swipe-wrap:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.swipe-wrap:only-child { border-radius: var(--radius); }
.swipe-action {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 12px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.swipe-action.show { opacity: 1; }
.swipe-action-left {
  background: linear-gradient(90deg, #1e3a1e 0%, #1e2a1e 100%);
  color: var(--green);
  justify-content: flex-start;
}
.swipe-action-right {
  background: linear-gradient(270deg, #3a2418 0%, #2a2418 100%);
  color: var(--gold);
  justify-content: flex-end;
}
.swipe-card-inner {
  position: relative;
  z-index: 1;
  background: var(--surface);
  transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
.swipe-card-inner.dragging { transition: none; }
/* Inside swipe-wrap, cards lose their own radius (wrap clips them) */
.swipe-card-inner .card { border-radius: 0 !important; }

/* Card press feedback */
.card { transition: background 0.1s ease, transform 0.12s ease; }
.card.pressing { transform: scale(0.985); background: var(--surface2); }

/* ─── Skeleton loading ─── */
@keyframes skel-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.9; }
}
.skel { background: var(--surface2); border-radius: 4px; animation: skel-pulse 1.4s ease-in-out infinite; }
.skel-card {
  background: var(--surface);
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1px;
}
.skel-card:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.skel-card:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.skel-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
.skel-text { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.skel-line { height: 10px; }
.skel-line.short { width: 40%; }
.skel-line.med { width: 70%; }

/* ─── Pull to refresh ─── */
.ptr-indicator {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -100%);
  padding: 12px 16px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 5;
}
.ptr-spinner {
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--text);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Celebration sparkles ─── */
.sparkle-burst {
  position: fixed;
  pointer-events: none;
  z-index: 300;
  width: 0; height: 0;
}
.sparkle {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  top: 0; left: 0;
  animation: sparkle-out 0.7s cubic-bezier(0.4, 0, 0.6, 1) forwards;
}
@keyframes sparkle-out {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  40% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 1; }
  100% { transform: translate(calc(var(--dx) * 1.4), calc(var(--dy) * 1.4 + 24px)) scale(0); opacity: 0; }
}

/* ─── Context menu (long-press) ─── */
.ctx-backdrop {
  position: fixed;
  inset: 0;
  z-index: 199;
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  transition: opacity 0.18s ease;
}
.ctx-backdrop.visible { opacity: 1; }
.ctx-menu {
  position: fixed;
  z-index: 200;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
  min-width: 220px;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.9);
  transform-origin: top left;
  transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.32, 0.72, 0, 1);
}
.ctx-menu.visible { opacity: 1; transform: scale(1); }
.ctx-item {
  padding: 13px 16px;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
}
.ctx-item:last-child { border-bottom: none; }
.ctx-item:active { background: var(--surface2); }
.ctx-item.danger { color: var(--red); }
.ctx-icon {
  width: 18px; height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
}
.ctx-item.danger .ctx-icon { color: var(--red); }

/* ─── Morning greeting ─── */
.greeting {
  padding: 0 20px 4px;
  margin-bottom: 4px;
}
.greeting-text {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.45;
}
.greeting-stat {
  color: var(--text);
  font-weight: 500;
}

/* ─── FLIP enable ─── */
[data-flip-id] { will-change: transform; }

/* ─── App body relative for PTR ─── */
.app-body { position: relative; }

/* Fade-in for first render */
@keyframes fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fade-in 0.25s ease-out both; }
</style>

function saveSettings() { localStorage.setItem('ros_settings', JSON.stringify(settings)); }

// ─── Toast ───
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);

// ─── Haptic feedback ───
// iOS Safari ignoriert vibrate(), Android nicht — wir versuchen's einfach.
function haptic(kind) {
  if (!navigator.vibrate) return;
  const map = { light: 8, medium: 14, heavy: 22, success: [10, 30, 14], warn: [14, 60, 14] };
  navigator.vibrate(map[kind] || 10);
}

// ─── Sheet open/close with slide-up animation ───
function openSheet(id, html) {
  const el = document.getElementById(id);
  // Inject sheet-handle immediately inside the .overlay-inner so it drags with the panel
  const handle = `<div class="sheet-grab" data-sheet-grab><div class="sheet-handle"></div></div>`;
  const injected = html.replace(/<div class="overlay-inner">/, `<div class="overlay-inner">${handle}`);
  el.innerHTML = injected;
  el.classList.add('open');
  // backdrop click closes
  el.onclick = (e) => { if (e.target === el) closeOverlay(id); };
  // drag-handle drag-to-dismiss
  bindSheetDrag(el);
  // double rAF ensures transition fires
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
  haptic('light');
}

function closeOverlay(id) {
  const el = document.getElementById(id);
  if (!el || !el.classList.contains('open')) return;
  el.classList.remove('visible');
  setTimeout(() => { el.classList.remove('open'); el.innerHTML = ''; }, 340);
}

function bindSheetDrag(overlay) {
  const inner = overlay.querySelector('.overlay-inner');
  const grab = overlay.querySelector('[data-sheet-grab]');
  if (!inner || !grab) return;
  let startY = 0, dragY = 0, dragging = false;
  grab.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
    dragging = true;
    dragY = 0;
    inner.classList.add('dragging');
  }, { passive: true });
  grab.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    dragY = Math.max(0, e.touches[0].clientY - startY);
    inner.style.transform = `translateY(${dragY}px)`;
  }, { passive: true });
  grab.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    inner.classList.remove('dragging');
    inner.style.transform = '';
    if (dragY > 100) closeOverlay(overlay.id);
  });
}

// ─── Gesture handler: tap + swipe + long-press in one ───
// Used on swipeable .card elements (Personen lists)
function bindCard(wrap, opts) {
  const inner = wrap.querySelector('.swipe-card-inner');
  const leftAction = wrap.querySelector('.swipe-action-left');
  const rightAction = wrap.querySelector('.swipe-action-right');
  let startX = 0, startY = 0, dx = 0, dy = 0;
  let dragging = false, swiping = false, longPressTimer = null;
  let crossedThreshold = false;
  const tapTarget = inner.querySelector('[data-tap]') || inner;

  const TH = 70; // threshold to trigger action
  const LONGPRESS = 480;

  const reset = () => {
    inner.classList.remove('dragging');
    inner.style.transform = '';
    if (leftAction) leftAction.classList.remove('show');
    if (rightAction) rightAction.classList.remove('show');
    crossedThreshold = false;
  };

  const onDown = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    dx = 0; dy = 0;
    dragging = true; swiping = false;
    inner.classList.add('pressing');
    longPressTimer = setTimeout(() => {
      if (dragging && !swiping) {
        haptic('medium');
        if (opts.onLongPress) opts.onLongPress(startX, startY);
        dragging = false;
        inner.classList.remove('pressing');
      }
    }, LONGPRESS);
  };

  const onMove = (e) => {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    dx = t.clientX - startX;
    dy = t.clientY - startY;
    if (!swiping && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
      swiping = true;
      clearTimeout(longPressTimer);
      inner.classList.remove('pressing');
      inner.classList.add('dragging');
    }
    if (swiping) {
      // dampen at edges
      const damped = Math.sign(dx) * Math.min(Math.abs(dx), wrap.offsetWidth * 0.6);
      inner.style.transform = `translateX(${damped}px)`;
      const reachedTH = Math.abs(dx) > TH;
      if (dx > 0) {
        if (leftAction) leftAction.classList.toggle('show', dx > 8);
        if (rightAction) rightAction.classList.remove('show');
      } else if (dx < 0) {
        if (rightAction) rightAction.classList.toggle('show', dx < -8);
        if (leftAction) leftAction.classList.remove('show');
      }
      if (reachedTH && !crossedThreshold) { crossedThreshold = true; haptic('light'); }
      if (!reachedTH && crossedThreshold) { crossedThreshold = false; }
    }
  };

  const onUp = (e) => {
    if (!dragging && !swiping) return;
    clearTimeout(longPressTimer);
    inner.classList.remove('pressing');
    if (swiping) {
      if (Math.abs(dx) > TH) {
        // Trigger action — animate off-screen, then reset
        const dir = dx > 0 ? 1 : -1;
        inner.style.transition = 'transform 0.22s ease-out';
        inner.style.transform = `translateX(${dir * wrap.offsetWidth}px)`;
        haptic('success');
        setTimeout(() => {
          if (dir > 0 && opts.onSwipeRight) opts.onSwipeRight();
          else if (dir < 0 && opts.onSwipeLeft) opts.onSwipeLeft();
          // reset after action — element may be removed by re-render
          inner.style.transition = '';
          reset();
        }, 220);
      } else {
        reset();
      }
    } else {
      // Tap — only fire if no swipe
      reset();
      if (opts.onTap) opts.onTap();
    }
    dragging = false; swiping = false;
  };

  wrap.addEventListener('touchstart', onDown, { passive: true });
  wrap.addEventListener('touchmove', onMove, { passive: true });
  wrap.addEventListener('touchend', onUp);
  wrap.addEventListener('touchcancel', () => { clearTimeout(longPressTimer); reset(); dragging = false; swiping = false; });
  wrap.addEventListener('mousedown', onDown);
  wrap.addEventListener('mousemove', onMove);
  wrap.addEventListener('mouseup', onUp);
  wrap.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); if (!swiping) { reset(); dragging = false; } });
}

// ─── Context menu ───
let ctxOpen = false;
function showContextMenu(items, x, y) {
  closeContextMenu();
  const backdrop = document.createElement('div');
  backdrop.className = 'ctx-backdrop';
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = items.map((it, i) =>
    `<div class="ctx-item ${it.danger ? 'danger' : ''}" data-i="${i}">
      <span class="ctx-icon">${it.icon || ''}</span>
      <span>${esc(it.label)}</span>
    </div>`
  ).join('');
  document.body.appendChild(backdrop);
  document.body.appendChild(menu);
  // position near tap, clamp to viewport
  const W = 220, H = items.length * 47 + 2;
  let px = Math.min(Math.max(8, x - 20), window.innerWidth - W - 8);
  let py = Math.min(y + 4, window.innerHeight - H - 12);
  if (py < 12) py = 12;
  menu.style.left = px + 'px';
  menu.style.top = py + 'px';
  requestAnimationFrame(() => { backdrop.classList.add('visible'); menu.classList.add('visible'); });
  ctxOpen = true;
  const close = () => { closeContextMenu(); };
  backdrop.addEventListener('click', close);
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('.ctx-item');
    if (!item) return;
    const i = +item.dataset.i;
    closeContextMenu();
    haptic('light');
    if (items[i] && items[i].action) items[i].action();
  });
}
function closeContextMenu() {
  document.querySelectorAll('.ctx-backdrop, .ctx-menu').forEach(el => {
    el.classList.remove('visible');
    setTimeout(() => el.remove(), 180);
  });
  ctxOpen = false;
}

// ─── Sparkle celebration ───
function celebrate(x, y) {
  const colors = ['#7ec87e', '#c8a87e', '#e0944e', '#f0ede8'];
  const burst = document.createElement('div');
  burst.className = 'sparkle-burst';
  burst.style.left = x + 'px';
  burst.style.top = y + 'px';
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
    const dist = 28 + Math.random() * 22;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.background = colors[i % colors.length];
    burst.appendChild(s);
  }
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 800);
}

// ─── FLIP — animate list reorders ───
function withFLIP(callback) {
  const before = new Map();
  document.querySelectorAll('[data-flip-id]').forEach(el => {
    before.set(el.dataset.flipId, el.getBoundingClientRect());
  });
  callback();
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-flip-id]').forEach(el => {
      const old = before.get(el.dataset.flipId);
      if (!old) return;
      const now = el.getBoundingClientRect();
      const dx = old.left - now.left;
      const dy = old.top - now.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.style.transition = 'none';
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        el.style.transition = 'transform 0.32s cubic-bezier(0.32, 0.72, 0, 1)';
        el.style.transform = '';
        setTimeout(() => { el.style.transition = ''; }, 350);
      });
    });
  });
}

// ─── Pull to refresh ───
function bindPullToRefresh(scrollEl, onRefresh) {
  let startY = 0, dy = 0, pulling = false, refreshing = false;
  let indicator = null;
  const TH = 70;

  scrollEl.addEventListener('touchstart', (e) => {
    if (refreshing) return;
    if (scrollEl.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
    dy = 0;
  }, { passive: true });

  scrollEl.addEventListener('touchmove', (e) => {
    if (!pulling || refreshing) return;
    dy = e.touches[0].clientY - startY;
    if (dy <= 0) { pulling = false; return; }
    // Resistance curve
    const pull = Math.min(dy * 0.5, 100);
    if (!indicator) {
      indicator = document.createElement('div');
      indicator.className = 'ptr-indicator';
      indicator.innerHTML = '<div class="ptr-spinner" style="opacity:0.4"></div><span>Loslassen</span>';
      scrollEl.appendChild(indicator);
    }
    indicator.style.transform = `translate(-50%, ${pull - 40}px)`;
    indicator.querySelector('span').textContent = pull > TH ? 'Loslassen' : 'Ziehen';
  }, { passive: true });

  scrollEl.addEventListener('touchend', async () => {
    if (!pulling || refreshing) return;
    pulling = false;
    const triggered = dy * 0.5 > TH;
    if (triggered && indicator) {
      refreshing = true;
      indicator.style.transform = 'translate(-50%, 30px)';
      indicator.querySelector('.ptr-spinner').style.opacity = '1';
      indicator.querySelector('span').textContent = 'Lädt...';
      haptic('light');
      try { await onRefresh(); } catch (e) {}
      indicator.style.transition = 'transform 0.25s, opacity 0.25s';
      indicator.style.opacity = '0';
      indicator.style.transform = 'translate(-50%, -100%)';
      setTimeout(() => { if (indicator) { indicator.remove(); indicator = null; } refreshing = false; }, 280);
    } else if (indicator) {
      indicator.style.transition = 'transform 0.2s ease';
      indicator.style.transform = 'translate(-50%, -100%)';
      setTimeout(() => { if (indicator) { indicator.remove(); indicator = null; } }, 220);
    }
  });
}

function greetingText() {

  if (h < 5) return 'Späte Stunde';
  if (h < 11) return 'Guten Morgen';
  if (h < 14) return 'Mittag';
  if (h < 18) return 'Nachmittag';
  if (h < 22) return 'Guten Abend';
  return 'Späte Stunde';
}

// ─── API helper ───
async function api(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) { console.error('API', res.status, await res.text()); return null; }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ─── Date helpers ───
function todayDate() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function isoDate(d) {
  if (!d) return null;
  if (typeof d === 'string') return d;
  return d.toISOString().split('T')[0];
}

function todayISO() { return isoDate(todayDate()); }

function parseDate(s) {
  if (!s) return null;
  const parts = s.split('-');
  return new Date(+parts[0], +parts[1]-1, +parts[2]);
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function daysSince(dateStr) {
  if (!dateStr) return 9999;
  return daysBetween(parseDate(dateStr), todayDate());
}

function formatDateGerman(dateStr) {
  if (!dateStr) return '--';
  const d = parseDate(dateStr);
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  return `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]}`;
}

function formatDateShort(dateStr) {
  if (!dateStr) return '--';
  const d = parseDate(dateStr);
  return `${d.getDate()}. ${['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][d.getMonth()]}`;
}

function formatDaysAgo(n) {
  if (n === 9999) return 'noch nie';
  if (n === 0) return 'heute';
  if (n === 1) return 'gestern';
  return n + ' Tage';
}

function daysUntilBday(bdayStr) {
  if (!bdayStr) return null;
  const b = parseDate(bdayStr);
  const t = todayDate();
  const thisYear = new Date(t.getFullYear(), b.getMonth(), b.getDate());
  if (thisYear < t) thisYear.setFullYear(t.getFullYear() + 1);
  return daysBetween(t, thisYear);
}

// ─── Domain logic ───
function threshold(level) {
  if (level === 'inner') return settings.freq_inner;
  if (level === 'close') return settings.freq_close;
  if (level === 'mid') return settings.freq_mid;
  return settings.freq_loose;
}

function urgency(k) {
  const ds = daysSince(k.last_contact);
  // "noch nie" is neutral, not urgent
  if (ds === 9999) return 'neutral';
  const t = threshold(k.level);
  // locker has no urgency tracking (freq=999)
  if (t >= 999) return 'ok';
  if (ds > t) return 'urgent';
  if (ds > t * 0.75) return 'soon';
  return 'ok';
}

function levelLabel(l) {
  if (l === 'inner') return 'inner circle';
  if (l === 'close') return 'eng';
  if (l === 'mid') return 'mittel';
  return 'locker';
}

function levelOrder(l) {
  if (l === 'inner') return 0;
  if (l === 'close') return 1;
  if (l === 'mid') return 2;
  return 3;
}

function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function avClass(level) {
  if (level === 'inner') return 'av-inner';
  if (level === 'close') return 'av-close';
  if (level === 'mid') return 'av-mid';
  return 'av-loose';
}

function urgClass(urg) {
  if (urg === 'neutral') return 'neutral';
  return urg === 'urgent' ? 'urgent' : urg === 'soon' ? 'soon' : 'ok';
}

// ─── Data loading ───
async function loadAll() {
  const [k, a, ak] = await Promise.all([

  });
  const titles = { heute: 'Heute', personen: 'Personen', anlaesse: 'Anlässe', settings: 'Einstellungen' };

  else if (currentTab === 'anlaesse') renderAnlaesse(body);

function updateHeaderDate() {

// ─── HEUTE VIEW ───
function renderHeute(container) {
  let html = '';

  // Overdue people (max 3) — exclude "noch nie" contacts
  const overdue = kontakte
    .filter(k => urgency(k) === 'urgent' && daysSince(k.last_contact) !== 9999)
    .sort((a, b) => daysSince(b.last_contact) - daysSince(a.last_contact))
    .slice(0, 3);

  // Personalized greeting at top
  const totalUrgent = kontakte.filter(k => urgency(k) === 'urgent' && daysSince(k.last_contact) !== 9999).length;
  const totalSoon = kontakte.filter(k => urgency(k) === 'soon').length;
  let greetingMsg;
  if (totalUrgent > 0) {
    greetingMsg = `<span class="greeting-stat">${totalUrgent}</span> ${totalUrgent === 1 ? 'Person wartet' : 'Menschen warten'} schon länger auf dich.`;
  } else if (totalSoon > 0) {
    greetingMsg = `Bei <span class="greeting-stat">${totalSoon}</span> ${totalSoon === 1 ? 'Person könnte sich bald' : 'Menschen könnte sich bald'} ein Gruß lohnen.`;
  } else {
    greetingMsg = 'Alle Beziehungen sind gerade frisch.';
  }
  html += `<div class="greeting"><div class="greeting-text">${greetingText()}. ${greetingMsg}</div></div>`;

  if (overdue.length) {
    html += '<div class="section"><div class="overdue-banner"><div class="overdue-title">Zu lange nichts gehört</div>';
    overdue.forEach(k => {
      const ds = daysSince(k.last_contact);
      html += `<div class="overdue-person" onclick="openPersonDetail(${k.id})">
        <div class="avatar ${avClass(k.level)}">${initials(k.name)}</div>
        <div class="overdue-person-name">${esc(k.name)}</div>
        <div class="overdue-person-days">${formatDaysAgo(ds)}</div>
      </div>`;
    });
    html += '</div></div>';
  }

  // Build 14-day timeline
  const today = todayDate();
  const todayStr = isoDate(today);
  let hasAnyDay = false;

  html += '<div class="section">';

  for (let i = 0; i < 14; i++) {
    const d = addDays(today, i);
    const dStr = isoDate(d);
    const items = [];

    // Find anlaesse on this day
    anlaesse.forEach(a => {
      let matchDate = a.datum;
      if (a.wiederkehrend || a.typ === 'geburtstag') {
        const orig = parseDate(a.datum);
        const thisYear = new Date(d.getFullYear(), orig.getMonth(), orig.getDate());
        matchDate = isoDate(thisYear);
      }
      if (matchDate === dStr) {
        items.push({ type: 'anlass', anlass: a });
      }
    });

    // Find actions due on this day (vorlauf logic)
    aktionen.forEach(ak => {
      if (ak.erledigt) return;
      const anlass = anlaesse.find(a => a.id === ak.anlass_id);
      if (!anlass) return;

      let anlassDatum = anlass.datum;
      if (anlass.wiederkehrend || anlass.typ === 'geburtstag') {
        const orig = parseDate(anlass.datum);
        const thisYear = new Date(today.getFullYear(), orig.getMonth(), orig.getDate());
        if (thisYear < today) thisYear.setFullYear(today.getFullYear() + 1);
        anlassDatum = isoDate(thisYear);
      }

      const dueDate = addDays(parseDate(anlassDatum), -(ak.vorlauf_tage || 0));
      if (isoDate(dueDate) === dStr) {
        const kontakt = kontakte.find(k => k.id === ak.kontakt_id);
        items.push({ type: 'aktion', aktion: ak, anlass, kontakt });
      }
    });

    // Birthday check — use upcoming bday relative to today, not d (handles year-boundary)
    kontakte.forEach(k => {
      if (!k.bday) return;
      const b = parseDate(k.bday);
      let upcomingBday = new Date(today.getFullYear(), b.getMonth(), b.getDate());
      if (upcomingBday < today) upcomingBday.setFullYear(today.getFullYear() + 1);
      const bdayStr = isoDate(upcomingBday);

      const hasMatchingAnlass = anlaesse.some(a => a.typ === 'geburtstag' && a.datum && (() => {
        const orig = parseDate(a.datum);
        return orig.getMonth() === b.getMonth() && orig.getDate() === b.getDate();
      })());

      if (bdayStr === dStr && !hasMatchingAnlass) {
        items.push({ type: 'birthday', kontakt: k, dayOffset: i });
      }

      const vorlaufDate = addDays(upcomingBday, -settings.bday_vorlauf);
      if (isoDate(vorlaufDate) === dStr && bdayStr !== dStr && !hasMatchingAnlass) {
        items.push({ type: 'bday-vorlauf', kontakt: k, daysUntil: settings.bday_vorlauf });
      }
    });

    if (items.length === 0) continue;
    hasAnyDay = true;

    const isToday = i === 0;
    const dayNames = ['So','Mo','Di','Mi','Do','Fr','Sa'];
    const dayLabel = isToday ? 'Heute' : (i === 1 ? 'Morgen' : dayNames[d.getDay()] + ', ' + d.getDate() + '. ' + ['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][d.getMonth()]);

    html += `<div class="day-row">`;
    html += `<div class="day-header ${isToday ? 'day-today' : ''}"><span>${dayLabel}</span></div>`;
    html += '<div class="cards">';

    items.forEach(item => {
      if (item.type === 'anlass') {
        const a = item.anlass;
        const people = aktionen.filter(ak => ak.anlass_id === a.id).map(ak => kontakte.find(k => k.id === ak.kontakt_id)).filter(Boolean);
        html += `<div class="card ok" onclick="openAnlassDetail(${a.id})">
          <div class="card-info">
            <div class="card-name">${esc(a.titel)}</div>
            <div class="card-meta">${people.map(p => esc(p.name)).join(', ') || a.typ}</div>
          </div>
          <div class="card-right"><div class="card-days ok">${a.typ}</div></div>
        </div>`;
      } else if (item.type === 'aktion') {
        const k = item.kontakt;
        const a = item.anlass;
        html += `<div class="card soon" onclick="${k ? `openPersonDetail(${k.id})` : ''}">
          <div class="avatar ${k ? avClass(k.level) : ''}">${k ? initials(k.name) : '--'}</div>
          <div class="card-info">
            <div class="card-name">${esc(item.aktion.was)}</div>
            <div class="card-meta">${k ? esc(k.name) : ''} ${a ? '/ ' + esc(a.titel) : ''}</div>
          </div>
          <div class="card-right"><div class="card-days soon">Vorlauf</div></div>
        </div>`;
      } else if (item.type === 'birthday') {
        const k = item.kontakt;
        const offset = item.dayOffset || 0;
        const rightLabel = offset === 0 ? 'heute' : (offset === 1 ? 'morgen' : 'in ' + offset + 'T');
        html += `<div class="card ok" onclick="openPersonDetail(${k.id})">
          <div class="avatar ${avClass(k.level)}">${initials(k.name)}</div>
          <div class="card-info">
            <div class="card-name">${esc(k.name)}</div>
            <div class="card-meta">Geburtstag</div>
          </div>
          <div class="card-right"><div class="card-days ok">${rightLabel}</div></div>
        </div>`;
      } else if (item.type === 'bday-vorlauf') {
        const k = item.kontakt;
        html += `<div class="card soon" onclick="openPersonDetail(${k.id})">
          <div class="avatar ${avClass(k.level)}">${initials(k.name)}</div>
          <div class="card-info">
            <div class="card-name">${esc(k.name)}</div>
            <div class="card-meta">Geburtstag in ${item.daysUntil} Tagen</div>
          </div>
          <div class="card-right"><div class="card-days soon">Vorlauf</div></div>
        </div>`;
      }
    });

    html += '</div></div>';
  }

  // "Heute möglich" section — quick actions for people you could contact
  const contactable = kontakte
    .filter(k => {
      const urg = urgency(k);
      return urg === 'soon' || urg === 'urgent';
    })
    .filter(k => daysSince(k.last_contact) !== 9999)
    .sort((a, b) => daysSince(b.last_contact) - daysSince(a.last_contact))
    .slice(0, 3);

  if (contactable.length && !overdue.length) {
    html += '<div class="section-label">Heute möglich</div>';
    html += '<div class="cards">';
    contactable.forEach(k => {
      const ds = daysSince(k.last_contact);
      html += `<div class="swipe-wrap" data-flip-id="m-${k.id}" data-kid="${k.id}">
        <div class="swipe-action swipe-action-left">Gemeldet</div>
        <div class="swipe-action swipe-action-right">Gedacht</div>
        <div class="swipe-card-inner">
          <div class="card soon" data-tap>
            <div class="avatar ${avClass(k.level)}">${initials(k.name)}</div>
            <div class="card-info">
              <div class="card-name">${esc(k.name)}</div>
              <div class="card-meta">Kurz melden?</div>
            </div>
            <div class="card-right"><div class="card-days soon">${formatDaysAgo(ds)}</div></div>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  if (!hasAnyDay && !overdue.length && !contactable.length) {
    html += '<div class="empty-block">Alles im grünen Bereich.</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

// ─── PERSONEN VIEW ───
function renderPersonen(container) {
  let html = '';

  // Search
  html += `<div class="search-bar">
    <input class="search-input" id="personSearchInput" placeholder="Suchen..." value="${esc(personSearch)}" oninput="onPersonSearch(this.value)">
  </div>`;

  // If searching, show flat filtered results
  if (personSearch) {
    const q = personSearch.toLowerCase();
    const list = kontakte.filter(k => k.name.toLowerCase().includes(q));
    html += '<div class="section"><div class="section-label">' + list.length + ' Ergebnisse</div>';
    if (!list.length) {
      html += '<div class="empty-block">Niemand gefunden</div>';
    } else {
      html += '<div class="cards">';
      list.forEach(k => {
        html += renderPersonCard(k);
      });
      html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    const si = document.getElementById('personSearchInput');
    if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
    return;
  }

  // Filters
  html += `<div class="filter-row">
    <button class="filter-btn ${personFilter==='all'?'active':''}" onclick="setPersonFilter('all')">Alle</button>
    <button class="filter-btn ${personFilter==='inner'?'active':''}" onclick="setPersonFilter('inner')">inner</button>
    <button class="filter-btn ${personFilter==='close'?'active':''}" onclick="setPersonFilter('close')">eng</button>
    <button class="filter-btn ${personFilter==='mid'?'active':''}" onclick="setPersonFilter('mid')">mittel</button>
    <button class="filter-btn ${personFilter==='loose'?'active':''}" onclick="setPersonFilter('loose')">locker</button>
  </div>`;

  // If filter active, show flat filtered list
  if (personFilter !== 'all') {
    const list = kontakte.filter(k => k.level === personFilter)
      .sort((a, b) => daysSince(b.last_contact) - daysSince(a.last_contact));
    html += '<div class="section"><div class="section-label">' + list.length + ' ' + levelLabel(personFilter) + '</div>';
    if (!list.length) {
      html += '<div class="empty-block">Niemand in dieser Gruppe</div>';
    } else {
      html += '<div class="cards">';
      list.forEach(k => { html += renderPersonCard(k); });
      html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    return;
  }

  // DEFAULT VIEW: Relevance section + Level groups

  // 1. "Gerade relevant" — urgent/soon people (max 5, horizontal scroll)
  const relevant = kontakte
    .filter(k => {
      const urg = urgency(k);
      return (urg === 'urgent' || urg === 'soon') && daysSince(k.last_contact) !== 9999;
    })
    .sort((a, b) => {
      // urgent first, then by days since
      const ua = urgency(a) === 'urgent' ? 0 : 1;
      const ub = urgency(b) === 'urgent' ? 0 : 1;
      if (ua !== ub) return ua - ub;
      return daysSince(b.last_contact) - daysSince(a.last_contact);
    })
    .slice(0, 5);

  if (relevant.length) {
    html += '<div class="relevance-section">';
    html += '<div class="relevance-question">Wen nicht aus den Augen verlieren?</div>';
    html += '<div class="relevance-cards">';
    relevant.forEach(k => {
      const urg = urgency(k);
      const ds = daysSince(k.last_contact);
      const bday = daysUntilBday(k.bday);
      let hint = formatDaysAgo(ds);
      let hintClass = urgClass(urg);
      if (bday !== null && bday <= 14) {
        hint = 'Geburtstag in ' + bday + 'T';
        hintClass = 'soon';
      }
      html += `<div class="relevance-card" onclick="openPersonDetail(${k.id})">
        <div class="relevance-card-avatar ${avClass(k.level)}">${initials(k.name)}</div>
        <div class="relevance-card-name">${esc(k.name)}</div>
        <div class="relevance-card-hint ${hintClass}">${hint}</div>
      </div>`;
    });
    html += '</div></div>';
  }

  // 2. Level groups
  const levels = [
    { key: 'inner', label: 'Inner Circle' },
    { key: 'close', label: 'Eng' },
    { key: 'mid', label: 'Mittel' },
    { key: 'loose', label: 'Locker' }
  ];

  html += '<div class="section">';

  levels.forEach(lvl => {
    const group = kontakte
      .filter(k => k.level === lvl.key)
      .sort((a, b) => {
        // Sort by urgency first, then by name
        const urgOrder = { urgent: 0, soon: 1, neutral: 2, ok: 3 };
        const ua = urgOrder[urgency(a)] ?? 3;
        const ub = urgOrder[urgency(b)] ?? 3;
        if (ua !== ub) return ua - ub;
        return a.name.localeCompare(b.name, 'de');
      });

    if (!group.length) return;

    const isCollapsed = collapsedGroups[lvl.key] === true;
    const chevronSvg = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>';

    html += `<div class="level-group">`;
    html += `<div class="level-group-header" onclick="toggleGroup('${lvl.key}')">
      <span class="level-group-title">${lvl.label}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="level-group-count">${group.length}</span>
        <span class="level-group-chevron ${isCollapsed ? 'collapsed' : ''}">${chevronSvg}</span>
      </span>
    </div>`;

    html += `<div class="level-group-cards ${isCollapsed ? 'collapsed' : ''}">`;
    group.forEach(k => { html += renderPersonCard(k); });
    html += '</div></div>';
  });

  html += '</div>';
  container.innerHTML = html;
}

function renderPersonCard(k) {
  const urg = urgency(k);
  const ds = daysSince(k.last_contact);
  const nextAnlass = findNextAnlassForPerson(k.id);
  const bday = daysUntilBday(k.bday);

  // Build secondary info
  let meta = '';
  if (bday !== null && bday <= 30) {
    meta = 'Geburtstag in ' + bday + 'T';
  } else if (nextAnlass) {
    meta = nextAnlass;
  } else if (k.note) {
    meta = k.note.split('\n')[0].substring(0, 40);
  }

  return `<div class="swipe-wrap" data-flip-id="p-${k.id}" data-kid="${k.id}">
    <div class="swipe-action swipe-action-left">Gemeldet</div>
    <div class="swipe-action swipe-action-right">Gedacht</div>
    <div class="swipe-card-inner">
      <div class="card ${urgClass(urg)}" data-tap>
        <div class="avatar ${avClass(k.level)}">${initials(k.name)}</div>
        <div class="card-info">
          <div class="card-name">${esc(k.name)}</div>
          <div class="card-meta">${meta ? esc(meta) : levelLabel(k.level)}</div>
        </div>

function findNextAnlassForPerson(kontaktId) {
  const personAktionen = aktionen.filter(a => a.kontakt_id === kontaktId);
  if (!personAktionen.length) return null;
  const today = todayDate();
  let closest = null;
  let closestDays = Infinity;
  personAktionen.forEach(ak => {
    const anlass = anlaesse.find(a => a.id === ak.anlass_id);
    if (!anlass) return;
    let datum = anlass.datum;
    if (anlass.wiederkehrend || anlass.typ === 'geburtstag') {
      const orig = parseDate(datum);
      const thisYear = new Date(today.getFullYear(), orig.getMonth(), orig.getDate());
      if (thisYear < today) thisYear.setFullYear(today.getFullYear() + 1);
      datum = isoDate(thisYear);
    }
    const days = daysBetween(today, parseDate(datum));
    if (days >= 0 && days < closestDays) {
      closestDays = days;
      closest = anlass.titel + ' in ' + days + 'T';
    }
  });
  return closest;
}

// ─── ANLAESSE VIEW ───
function renderAnlaesse(container) {
  const today = todayDate();
  const end = addDays(today, 90);

  const upcoming = [];
  anlaesse.forEach(a => {
    let datum;
    if (a.wiederkehrend || a.typ === 'geburtstag') {
      const orig = parseDate(a.datum);
      datum = new Date(today.getFullYear(), orig.getMonth(), orig.getDate());
      if (datum < today) datum = new Date(today.getFullYear() + 1, orig.getMonth(), orig.getDate());
    } else {
      datum = parseDate(a.datum);
    }
    if (datum >= today && datum <= end) {
      upcoming.push({ ...a, _effectiveDate: datum, _effectiveDateStr: isoDate(datum) });
    }
  });

  // Auto-birthdays
  kontakte.forEach(k => {
    if (!k.bday) return;
    const b = parseDate(k.bday);
    let bdayDate = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if (bdayDate < today) bdayDate = new Date(today.getFullYear() + 1, b.getMonth(), b.getDate());
    if (bdayDate > end) return;
    const covered = upcoming.some(u => u.typ === 'geburtstag' && u._effectiveDate.getTime() === bdayDate.getTime());
    if (!covered) {
      upcoming.push({
        id: null,
        titel: 'Geburtstag ' + k.name,
        typ: 'geburtstag',
        wiederkehrend: true,
        _effectiveDate: bdayDate,
        _effectiveDateStr: isoDate(bdayDate),
        _autoKontakt: k
      });
    }
  });

  upcoming.sort((a, b) => a._effectiveDate - b._effectiveDate);

  let html = '<div class="section">';

  if (!upcoming.length) {
    html += '<div class="section-label">Nächste 90 Tage</div>';
    html += '<div class="empty-block">Keine Anlässe geplant</div>';
  } else {
    let currentMonth = '';
    upcoming.forEach(a => {
      const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
      const m = monthNames[a._effectiveDate.getMonth()] + ' ' + a._effectiveDate.getFullYear();
      if (m !== currentMonth) {
        if (currentMonth) html += '</div>';
        currentMonth = m;
        html += `<div class="anlass-month">${m}</div><div class="cards">`;
      }

      const dayNames = ['So','Mo','Di','Mi','Do','Fr','Sa'];
      const relAktionen = a.id ? aktionen.filter(ak => ak.anlass_id === a.id) : [];
      const openCount = relAktionen.filter(ak => !ak.erledigt).length;
      const people = relAktionen.map(ak => kontakte.find(k => k.id === ak.kontakt_id)).filter(Boolean);
      const peopleNames = a._autoKontakt ? esc(a._autoKontakt.name) : people.map(p => esc(p.name)).join(', ');

      html += `<div class="anlass-card" onclick="${a.id ? `openAnlassDetail(${a.id})` : ''}">
        <div class="anlass-date-col">
          <div class="anlass-day">${a._effectiveDate.getDate()}</div>
          <div class="anlass-weekday">${dayNames[a._effectiveDate.getDay()]}</div>
        </div>
        <div class="anlass-info">
          <div class="anlass-title">${esc(a.titel)}</div>
          ${peopleNames ? `<div class="anlass-people">${peopleNames}</div>` : ''}
          ${openCount > 0 ? `<div class="anlass-actions-count">${openCount} offen</div>` : ''}
        </div>
        <div class="anlass-typ">${a.typ || ''}</div>
      </div>`;
    });
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

      <div class="info-row"><span class="info-key">Vor</span><span class="info-val" style="color:${urgColor}">${formatDaysAgo(ds)}</span></div>
      <div class="info-row"><span class="info-key">Ziel</span><span class="info-val">${freqLabel}</span></div>
      <div class="info-row"><span class="info-key">Geburtstag</span><span class="info-val">${k.bday ? formatDateShort(k.bday) + (bday !== null ? ' (in ' + bday + 'T)' : '') : '--'}</span></div>

      <button class="action-btn" onclick="markDranGedacht(${k.id})"><span>Dran gedacht</span><span class="action-arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l4-4-4-4"/></svg></span></button>

      <button class="action-btn" onclick="closeOverlay('overlayDetail');openPersonForm(${k.id})"><span>Bearbeiten</span><span class="action-arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l4-4-4-4"/></svg></span></button>
    </div>`;

  if (personAnlaesse.length) {
    html += '<div class="section-label" style="margin-top:8px">Anlässe</div><div class="cards">';
    personAnlaesse.forEach(a => {
      html += `<div class="card ok" onclick="closeOverlay('overlayDetail');openAnlassDetail(${a.id})">
        <div class="card-info">
          <div class="card-name">${esc(a.titel)}</div>
          <div class="card-meta">${formatDateShort(a.datum)} / ${a.typ}</div>
        </div>

async function markContacted(id, opts = {}) {
  const k = kontakte.find(x => x.id === id);
  if (!k) return;
  const prev = k.last_contact;
  // Optimistic update
  k.last_contact = todayISO();
  haptic('success');
  showToast('✓ ' + k.name);
  if (opts.fromSwipe) celebrateAtElement(`[data-kid="${id}"]`);
  if (!opts.fromSwipe) closeOverlay('overlayDetail');
  withFLIP(() => render());
  // Sync in background
  const rows = await api(`kontakte?id=eq.${id}`, { method: 'PATCH', body: { last_contact: todayISO() } });
  if (!rows || !rows[0]) {
    k.last_contact = prev;
    showToast('Sync fehlgeschlagen');
    render();
  } else {
    Object.assign(k, rows[0]);
  }
}

async function markDranGedacht(id, opts = {}) {
  const k = kontakte.find(x => x.id === id);
  if (!k) return;
  const prev = k.last_contact;
  k.last_contact = todayISO();
  haptic('light');
  showToast('Gedacht — ' + k.name);
  if (!opts.fromSwipe) closeOverlay('overlayDetail');
  withFLIP(() => render());
  const rows = await api(`kontakte?id=eq.${id}`, { method: 'PATCH', body: { last_contact: todayISO() } });
  if (!rows || !rows[0]) {
    k.last_contact = prev;
    showToast('Sync fehlgeschlagen');
    render();
  } else {
    Object.assign(k, rows[0]);
  }
}

function celebrateAtElement(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  const r = el.getBoundingClientRect();
  celebrate(r.left + r.width / 2, r.top + r.height / 2);
}

async function deletePerson(id) {
  if (!confirm('Person wirklich löschen?')) return;
  await api(`aktionen?kontakt_id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
  await api(`kontakte?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
  aktionen = aktionen.filter(a => a.kontakt_id !== id);
  kontakte = kontakte.filter(k => k.id !== id);
  closeOverlay('overlayDetail');
  render();
}

async function toggleAktion(aktionId, personId) {
  const ak = aktionen.find(a => a.id === aktionId);
  if (!ak) return;
  const rows = await api(`aktionen?id=eq.${aktionId}`, { method: 'PATCH', body: { erledigt: !ak.erledigt } });
  if (rows && rows[0]) {
    const idx = aktionen.findIndex(a => a.id === aktionId);
    if (idx >= 0) aktionen[idx] = rows[0];
  }
  openPersonDetail(personId);
  render();
}

async function savePerson(id) {
  const name = document.getElementById('pf-name').value.trim();
  if (!name) return;
  const level = document.getElementById('overlayForm').dataset.level || 'close';
  const bday = document.getElementById('pf-bday').value || null;
  const last_contact = document.getElementById('pf-last').value || null;
  const note = document.getElementById('pf-note').value.trim() || null;

  const body = { name, level, bday, last_contact, note };

  if (id) {
    const rows = await api(`kontakte?id=eq.${id}`, { method: 'PATCH', body });
    if (rows && rows[0]) {
      const idx = kontakte.findIndex(k => k.id === id);
      if (idx >= 0) kontakte[idx] = rows[0];
    }
  } else {
    const rows = await api('kontakte', { method: 'POST', body });
    if (rows && rows[0]) kontakte.unshift(rows[0]);
  }

  closeOverlay('overlayForm');
  showToast(id ? 'Gespeichert' : 'Person eingetragen');
  render();
}
